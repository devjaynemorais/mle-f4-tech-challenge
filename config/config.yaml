project:
  name: Credit Scoring Observability API
  version: "0.1.0"

data:
  # Home Credit Default Risk (Kaggle). O CSV bruto fica fora do Git (data/raw/).
  raw_path: data/raw
  raw_file: application_train.csv
  id_column: SK_ID_CURR
  # 1 = cliente com dificuldade de pagamento (default); 0 = adimplente
  target_column: TARGET
  processed_path: data/processed
  # Treino gera referência e produção-base com TARGET real; drift é posterior.
  reference_file: ref_data.csv
  production_file: prod_data.csv

model:
  # Probabilidade de default acima deste limiar vira predição "default".
  # Limiar de negócio: a ser revisado na Etapa 4 (impacto de falsos negativos).
  prediction_threshold: 0.5
  # Fração do CSV bruto reservada para a base estável de produção simulada.
  production_size: 0.2
  # Comparação de candidatos somente dentro da referência (80%).
  cv_folds: 5
  # Seed de reprodutibilidade do treino (split e modelos).
  random_state: 42

artifacts:
  model_path: models/artifacts
  model_file: credit_model.joblib
  baseline_file: logistic_baseline.joblib

mlflow:
  # Servidor de tracking. Sobrescrito pela env MLFLOW_TRACKING_URI (o compose
  # aponta o serviço de treino para http://mlflow:5000).
  tracking_uri: http://localhost:5000
  experiment: credit-scoring

drift:
  stable_file: prod_periodo1_estavel.csv
  drifted_file: prod_periodo2_drift.csv
  manifest_file: data_drift_simulation_manifest.json
  report_html: reports/data_drift_report.html
  summary_csv: reports/data_drift_summary.csv
  alpha: 0.05
  psi_threshold: 0.25
  n_bins: 10
  # Comparação de sanidade: referência de treino x período estável (sem drift).
  baseline_report_html: reports/data_drift_reference_vs_stable.html
  baseline_summary_csv: reports/data_drift_reference_vs_stable.csv
  # Predições em lote dos períodos de produção (arquivos locais, fora do Git).
  predictions_stable_file: predicoes_periodo1_estavel.csv
  predictions_drifted_file: predicoes_periodo2_drift.csv
  scoring_summary_file: metrics/batch_scoring_summary.json

contract:
  # Regras rígidas do contrato de dados (Pandera) aplicadas a cada lote.
  min_age_years: 18
  max_income_total: 1000000000

observability:
  # Eventos estruturados do pipeline (sem identificadores nem valores de clientes).
  events_file: logs/pipeline_events.jsonl
  events_max_bytes: 5000000
  pushgateway_job: credit-pipeline
  mlflow_experiment: credit-pipeline-monitoring
  # Fração de features numéricas com PSI >= psi_threshold que gera alerta.
  # Pontos de partida: recalibrar com a comparação referência x período estável.
  drift_warning_share: 0.02
  drift_critical_share: 0.05
