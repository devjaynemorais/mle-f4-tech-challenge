# Stack do Tech Challenge da Fase 4: API de crédito + Prometheus + Grafana + MLflow.
# Uso:
#   docker compose up --build            # sobe api + prometheus + grafana + mlflow
#   curl http://localhost:8000/health    # "degraded" até existir models/artifacts/
services:
  api:
    build:
      context: .
      target: api
    image: mle-f4-tech-challenge-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./models:/app/models:ro
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Treino do modelo (Etapa 1). Não sobe com `up`; rode sob demanda:
  #   docker compose run --rm train
  # Requer data/raw/application_train.csv no host; grava datasets em
  # data/processed/, o artefato em models/ e as métricas em metrics/.
  train:
    build:
      context: .
      target: train
    image: mle-f4-tech-challenge-train
    profiles: ["train"]
    command: ["python", "-m", "src.models.train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./models:/app/models
      - ./metrics:/app/metrics
      - ./logs:/app/logs
    depends_on:
      - mlflow
      - pushgateway
    networks:
      - ml-network

  # Simulação de drift, predição em lote e relatórios (Etapas 2 e 3). Roda sob
  # demanda, depois do treino, na imagem do treino (que tem MLflow):
  #   docker compose run --rm drift
  drift:
    build:
      context: .
      target: train
    image: mle-f4-tech-challenge-train
    profiles: ["train"]
    command:
      - sh
      - -c
      - >
        export PIPELINE_RUN_ID=$${PIPELINE_RUN_ID:-$$(python -c 'import uuid;print(uuid.uuid4().hex[:12])')} &&
        python -m src.drift.data_drift_simulation &&
        python -m src.drift.predict_batch &&
        python -m src.drift.report
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - ./data/processed:/app/data/processed
      - ./models:/app/models:ro
      - ./metrics:/app/metrics
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      - mlflow
      - pushgateway
    networks:
      - ml-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    entrypoint: ["mlflow"]
    command: >
      server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow-data/mlflow.db
      --default-artifact-root /mlflow-data/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlflow-data:/mlflow-data
    networks:
      - ml-network

  # Recebe as métricas dos jobs em lote (treino, drift, predição). Sem
  # autenticação: publicado só em 127.0.0.1.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"
    networks:
      - ml-network

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - ml-network
    depends_on:
      - api
      - pushgateway

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ml-network
    depends_on:
      - prometheus

networks:
  ml-network:
    driver: bridge
