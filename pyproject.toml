[tool.poetry]
name = "mle-f4-tech-challenge"
version = "0.1.0"
description = "Credit scoring em produção com contratos de dados, detecção de drift, observabilidade e governança (LGPD) — FIAP MLE Fase 4"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.2.0"
numpy = ">=1.26.0,<2.0.0"
scikit-learn = ">=1.4.0,<1.8"
xgboost = ">=2.1,<3"
scipy = ">=1.11"
pandera = ">=0.22,<1.0"
evidently = ">=0.7,<0.8"
pydantic-settings = ">=2.2.0"
pyyaml = ">=6.0.1"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
prometheus-client = ">=0.20.0"
joblib = ">=1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0"
mypy = ">=1.10.0"
pre-commit = ">=3.7.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN", "D", "C90"]
ignore = [
    "ANN401",  # Any em interfaces abstratas é intencional
    "D100",    # docstring em módulo público
    "D104",    # docstring em pacote público
    "D107",    # docstring em __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"scripts/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
