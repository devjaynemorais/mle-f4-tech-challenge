global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: credit-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Métricas dos jobs em lote (treino, drift, predição), enviadas ao Pushgateway.
  # honor_labels preserva job/stage/dataset informados por quem publicou.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
